[variables]
NIXPACKS_PHP_VERSION = '8.3'

[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer', 'nodejs_20']

[phases.build]
cmds = [
  'composer install --no-dev --optimize-autoloader --ignore-platform-reqs',
  'npm install',
  'npm run build'
]

[start]
cmd = 'php artisan config:clear && php artisan route:clear && php artisan migrate --force && php artisan db:seed --class=UserSeeder --force && php artisan serve --host 0.0.0.0 --port $PORT'
